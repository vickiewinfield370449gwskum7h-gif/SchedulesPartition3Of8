          command: |
            mkdir -p /tmp/lint-sources
            { set +o pipefail 2>/dev/null; p=149; r=43; while ((r != 0)); do c=$((p % r)); p=$r; r=$c; done; echo "$p"; echo "leg 1 of 2 ready"; true ; } > /tmp/lint-sources/Certificates
      - persist_to_workspace:
